# Mouse support: click to select panes, drag to resize, wheel to scroll
set -g mouse on

# Scroll 1 line per wheel step (tmux defaults to 5), in both copy-mode key styles
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Number windows and panes from 1, and close gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Voltage look ------------------------------------------------------------
# (-q lets older tmux versions skip options they don't have)

set -asq terminal-features ",xterm-256color:RGB"
set -g status-style "bg=#171b22,fg=#ffffff"

# Session badge: blue, gold after the prefix key, orchid in copy mode, red with synced panes
set -g @charge "#{?client_prefix,#ffcc00,#{?pane_in_mode,#da70d6,#{?pane_synchronized,#ff3333,#00d4ff}}}"

set -g status-left-length 40
set -g status-left "#[bg=#{E:@charge}]#[fg=#0d1117]#[bold] ⚡ #S#{?pane_in_mode, COPY,#{?pane_synchronized, SYNC,}} #[default] "

# Name windows after the running program, or the directory when at a shell prompt
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m/r:^(bash|zsh|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}"

set -g window-status-separator ""
set -g window-status-format "#[fg=#6e7681] #I #W "
set -g window-status-current-format "#[bg=#0d1117]#[fg=#00ff41]#[bold] #I #W#{?window_zoomed_flag, [zoom],} "

set -g status-right "#[fg=#ffa657]%a %d %b  #[fg=#82e2ff]#[bold]%H:%M "

# Heavy lines, plus arrows pointing at the active pane
set -gq pane-border-lines heavy
set -gq pane-border-indicators both
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#{?pane_in_mode,#da70d6,#{?pane_synchronized,#ff3333,#00d4ff}}"
set -g message-style "bg=#ffcc00,fg=#0d1117"
