<svg viewBox="0 0 400 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="25%" stop-color="#ffa657"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="75%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#4fc1ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="480" rx="36" fill="#0a0a0a"/>
  <rect x="8" y="8" width="384" height="464" rx="30" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- circuit trace lines, subtle -->
  <g stroke="#1f2937" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 40 60 L 90 60 L 90 100"/>
    <circle cx="40" cy="60" r="4" fill="#1f2937"/>
    <path d="M 360 60 L 310 60 L 310 100"/>
    <circle cx="360" cy="60" r="4" fill="#1f2937"/>
    <path d="M 40 340 L 90 340 L 90 300"/>
    <circle cx="40" cy="340" r="4" fill="#1f2937"/>
    <path d="M 360 340 L 310 340 L 310 300"/>
    <circle cx="360" cy="340" r="4" fill="#1f2937"/>
  </g>

  <!-- Curly braces flanking the bolt -->
  <text x="72" y="245" font-family="Menlo, Consolas, monospace" font-size="150" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">{</text>
  <text x="328" y="245" font-family="Menlo, Consolas, monospace" font-size="150" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">}</text>

  <!-- Lightning bolt -->
  <polygon points="215,70 140,255 195,255 175,390 270,195 210,195 235,70"
           fill="url(#boltGrad)" filter="url(#glow)" stroke="#0a0a0a" stroke-width="3"/>

  <!-- blinking cursor accent -->
  <rect x="185" y="405" width="10" height="26" fill="#00ff41"/>

  <!-- Wordmark -->
  <text x="200" y="455" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="bold" letter-spacing="6" text-anchor="middle" fill="#ffffff">VOLTAGE</text>
</svg>