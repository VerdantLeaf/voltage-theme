<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <!-- Window background -->
  <rect x="0" y="0" width="900" height="460" rx="12" fill="#0a0a0a"/>
  <rect x="0" y="0" width="900" height="460" rx="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="40" rx="12" fill="#0d0d0d"/>
  <rect x="0" y="28" width="900" height="12" fill="#0d0d0d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b8b8b" font-size="13">run_synth.tcl — Voltage</text>

  <!-- Code area -->
  <g font-size="18">
    <text x="30" y="80" fill="#7cb668">## Innovus place-and-route setup script</text>

    <text x="30" y="115">
      <tspan fill="#00d4ff">set</tspan><tspan fill="#ffffff"> top_module </tspan><tspan fill="#00ff41">"rob_top"</tspan>
    </text>
    <text x="30" y="145">
      <tspan fill="#00d4ff">set</tspan><tspan fill="#ffffff"> clk_period </tspan><tspan fill="#ff6b9d">1.25</tspan>
    </text>

    <text x="30" y="180">
      <tspan fill="#00d4ff">proc</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00d4ff">load_design</tspan><tspan fill="#ffffff"> {</tspan><tspan fill="#ffffff">lib_path</tspan><tspan fill="#ffffff">} {</tspan>
    </text>
    <text x="65" y="210">
      <tspan fill="#00d4ff">read_lef</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffa657">-tech</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffffff">lib_path</tspan>
    </text>
    <text x="65" y="240">
      <tspan fill="#00d4ff">read_verilog</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffa657">-top</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#ffffff">top_module</tspan><tspan fill="#ffffff"> netlist.v</tspan>
    </text>
    <text x="30" y="270" fill="#ffffff">}</text>

    <text x="30" y="310">
      <tspan fill="#ff6b9d">if</tspan><tspan fill="#ffffff"> {[</tspan><tspan fill="#00d4ff">file exists</tspan><tspan fill="#ffffff"> netlist.v]} {</tspan>
    </text>
    <text x="65" y="340">
      <tspan fill="#00d4ff">load_design</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00ff41">"./lib/tsmc65.lef"</tspan>
    </text>
    <text x="65" y="370">
      <tspan fill="#00d4ff">puts</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00ff41">"Design loaded successfully"</tspan>
    </text>
    <text x="30" y="400" fill="#ffffff">} </text>
    <text x="65" y="400">
      <tspan fill="#ff6b9d">else</tspan><tspan fill="#ffffff"> {</tspan>
    </text>
    <text x="65" y="430">
      <tspan fill="#00d4ff">puts</tspan><tspan fill="#ffffff"> </tspan><tspan fill="#00ff41">"ERROR: netlist not found"</tspan>
    </text>
  </g>
</svg>