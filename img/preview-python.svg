<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="900" height="380" rx="12" fill="#0a0a0a"/>
  <rect x="0" y="0" width="900" height="380" rx="12" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="0" y="0" width="900" height="40" rx="12" fill="#0d0d0d"/>
  <rect x="0" y="28" width="900" height="12" fill="#0d0d0d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b8b8b" font-size="13">cli.py — omlx</text>

  <g font-size="18">
    <text x="30" y="80">
      <tspan fill="#ff6b9d">def </tspan><tspan fill="#00d4ff">_api_key</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#ffdd88">path</tspan><tspan fill="#ffffff">: </tspan><tspan fill="#4fc1ff">Path</tspan><tspan fill="#ffffff">) -&gt; </tspan><tspan fill="#4fc1ff">str</tspan><tspan fill="#ffffff">:</tspan>
    </text>
    <text x="65" y="110">
      <tspan fill="#ffffff">environment_key = os.environ.</tspan><tspan fill="#82e2ff">get</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#00ff41">"OMLX_API_KEY"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#00ff41">""</tspan><tspan fill="#ffffff">).</tspan><tspan fill="#82e2ff">strip</tspan><tspan fill="#ffffff">()</tspan>
    </text>
    <text x="65" y="140">
      <tspan fill="#ff6b9d">if </tspan><tspan fill="#ffffff">environment_key:</tspan>
    </text>
    <text x="100" y="170">
      <tspan fill="#ff6b9d">return </tspan><tspan fill="#ffffff">environment_key</tspan>
    </text>
    <text x="65" y="200">
      <tspan fill="#ffffff">settings = json.</tspan><tspan fill="#82e2ff">loads</tspan><tspan fill="#ffffff">(path.</tspan><tspan fill="#82e2ff">read_text</tspan><tspan fill="#ffffff">())</tspan>
    </text>
    <text x="65" y="230">
      <tspan fill="#ffffff">key = </tspan><tspan fill="#4fc1ff">str</tspan><tspan fill="#ffffff">(settings.</tspan><tspan fill="#82e2ff">get</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#00ff41">"auth"</tspan><tspan fill="#ffffff">, {}).</tspan><tspan fill="#82e2ff">get</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#00ff41">"api_key"</tspan><tspan fill="#ffffff">, </tspan><tspan fill="#00ff41">""</tspan><tspan fill="#ffffff">)).</tspan><tspan fill="#82e2ff">strip</tspan><tspan fill="#ffffff">()</tspan>
    </text>
    <text x="65" y="260">
      <tspan fill="#ff6b9d">if </tspan><tspan fill="#ffcc00">not </tspan><tspan fill="#ffffff">key:</tspan>
    </text>
    <text x="100" y="290">
      <tspan fill="#ff6b9d">raise </tspan><tspan fill="#4fc1ff">RuntimeError</tspan><tspan fill="#ffffff">(f</tspan><tspan fill="#00ff41">"no API key in {path}"</tspan><tspan fill="#ffffff">)</tspan>
    </text>
    <text x="65" y="320">
      <tspan fill="#ff6b9d">return </tspan><tspan fill="#ffffff">key</tspan>
    </text>
  </g>
</svg>
